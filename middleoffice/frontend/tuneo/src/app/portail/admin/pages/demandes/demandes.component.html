<!-- Header -->
<div class="p-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">📋 Demandes d'ajout de lieu</h1>

  <!-- Filtres -->
  <div class="flex flex-wrap gap-2 mb-6">
    <button (click)="setFilter('ALL')"
      class="px-4 py-2 rounded-lg border text-sm font-semibold transition-colors"
      [style.background]="filter === 'ALL' ? '#86B817' : '#fff'"
      [style.color]="filter === 'ALL' ? '#fff' : '#374151'"
      [style.borderColor]="filter === 'ALL' ? '#86B817' : '#d1d5db'">
      Toutes
      <span class="ml-1.5 inline-flex items-center justify-center rounded-full w-5 h-5 text-xs font-bold"
            [style.background]="filter === 'ALL' ? 'rgba(255,255,255,0.3)' : '#86B817'"
            style="color:#fff;">
        {{ demandes.length }}
      </span>
    </button>
    <button (click)="setFilter('PENDING')"
      class="px-4 py-2 rounded-lg border text-sm font-semibold transition-colors"
      [style.background]="filter === 'PENDING' ? '#86B817' : '#fff'"
      [style.color]="filter === 'PENDING' ? '#fff' : '#374151'"
      [style.borderColor]="filter === 'PENDING' ? '#86B817' : '#d1d5db'">
      En attente
      <span class="ml-1.5 inline-flex items-center justify-center rounded-full w-5 h-5 text-xs font-bold"
            [style.background]="filter === 'PENDING' ? 'rgba(255,255,255,0.3)' : '#f59e0b'"
            style="color:#fff;">
        {{ pendingCount }}
      </span>
    </button>
    <button (click)="setFilter('ACCEPTED')"
      class="px-4 py-2 rounded-lg border text-sm font-semibold transition-colors"
      [style.background]="filter === 'ACCEPTED' ? '#86B817' : '#fff'"
      [style.color]="filter === 'ACCEPTED' ? '#fff' : '#374151'"
      [style.borderColor]="filter === 'ACCEPTED' ? '#86B817' : '#d1d5db'">
      Acceptées
      <span class="ml-1.5 inline-flex items-center justify-center rounded-full w-5 h-5 text-xs font-bold"
            [style.background]="filter === 'ACCEPTED' ? 'rgba(255,255,255,0.3)' : '#10b981'"
            style="color:#fff;">
        {{ acceptedCount }}
      </span>
    </button>
    <button (click)="setFilter('REFUSED')"
      class="px-4 py-2 rounded-lg border text-sm font-semibold transition-colors"
      [style.background]="filter === 'REFUSED' ? '#86B817' : '#fff'"
      [style.color]="filter === 'REFUSED' ? '#fff' : '#374151'"
      [style.borderColor]="filter === 'REFUSED' ? '#86B817' : '#d1d5db'">
      Refusées
      <span class="ml-1.5 inline-flex items-center justify-center rounded-full w-5 h-5 text-xs font-bold"
            [style.background]="filter === 'REFUSED' ? 'rgba(255,255,255,0.3)' : '#ef4444'"
            style="color:#fff;">
        {{ refusedCount }}
      </span>
    </button>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl shadow overflow-hidden">
    <table class="w-full text-sm text-gray-700">
      <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
        <tr>
          <th class="px-4 py-3 text-left">Image</th>
          <th class="px-4 py-3 text-left">Nom</th>
          <th class="px-4 py-3 text-left">Catégorie</th>
          <th class="px-4 py-3 text-left">Client</th>
          <th class="px-4 py-3 text-left">Adresse</th>
          <th class="px-4 py-3 text-left">Statut</th>
          <th class="px-4 py-3 text-left">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let d of filteredDemandes" class="hover:bg-gray-50 transition">

          <!-- Image -->
          <td class="px-4 py-3">
            <img *ngIf="d.imageUrl" [src]="d.imageUrl"
              class="w-14 h-14 object-cover rounded-lg" alt="image">
            <div *ngIf="!d.imageUrl"
              class="w-14 h-14 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400 text-xs">
              N/A
            </div>
          </td>

          <!-- Nom -->
          <td class="px-4 py-3">
            <p class="font-semibold text-gray-800">{{ d.name }}</p>
            <p class="text-gray-400 text-xs">{{ d.description | slice:0:50 }}...</p>
          </td>

          <!-- Catégorie -->
          <td class="px-4 py-3 text-gray-700">{{ d.categorie?.name }}</td>

          <!-- Client -->
          <td class="px-4 py-3 text-gray-700">{{ d.clientUsername || '—' }}</td>

          <!-- Adresse -->
          <td class="px-4 py-3 text-gray-700">{{ d.address || '—' }}</td>

          <!-- Statut -->
          <td class="px-4 py-3">
            <span [class]="'px-2 py-1 rounded-full text-xs font-semibold ' + getBadgeClass(d.statut)">
              {{ d.statut }}
            </span>
          </td>

          <!-- Actions -->
          <td class="px-4 py-3">
            <div class="flex gap-2">
              <!-- Accepter -->
              <button *ngIf="d.statut === 'PENDING'"
                (click)="accept(d.id!)"
                class="px-3 py-1 bg-green-500 text-white text-xs rounded-lg hover:bg-green-600 transition">
                ✅ Accepter
              </button>
              <!-- Refuser -->
              <button *ngIf="d.statut === 'PENDING'"
                (click)="refuse(d.id!)"
                class="px-3 py-1 bg-red-500 text-white text-xs rounded-lg hover:bg-red-600 transition">
                ❌ Refuser
              </button>
              <!-- Supprimer -->
              <button (click)="delete(d.id!)"
                class="px-3 py-1 bg-gray-400 text-white text-xs rounded-lg hover:bg-gray-500 transition">
                🗑️
              </button>
            </div>
          </td>
        </tr>

        <!-- Aucune demande -->
        <tr *ngIf="filteredDemandes.length === 0">
          <td colspan="7" class="text-center py-10 text-gray-400">
            Aucune demande trouvée.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
