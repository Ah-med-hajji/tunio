<div class="rounded-2xl border border-gray-200 bg-white pt-4 dark:border-white/[0.05] dark:bg-white/[0.03]" (click)="closeAllDropdowns()">

  <!-- Header : Titre + Barre de recherche -->
  <div class="flex flex-col gap-2 px-5 mb-4 sm:flex-row sm:items-center sm:justify-between sm:px-6">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Catégories</h3>
    <div class="relative" (click)="$event.stopPropagation()">
      <button class="absolute -translate-y-1/2 left-4 top-1/2" type="button">
        <svg class="text-gray-400 size-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
        </svg>
      </button>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearch()"
        placeholder="Rechercher une catégorie..."
        class="h-[42px] w-full rounded-lg border border-gray-300 bg-transparent py-2.5 pl-[42px] pr-4 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-none focus:ring-2 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 xl:w-[300px]"
      />
    </div>
  </div>

  <!-- Bouton Ajouter -->
  <div class="px-5 sm:px-6 mb-4">
    <button
      (click)="openAddModal(); $event.stopPropagation()"
      class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2 text-sm font-medium text-white hover:bg-brand-600 transition-colors"
    >
      <span>+</span> Ajouter une catégorie
    </button>
  </div>

  <!-- Table -->
  <div class="overflow-hidden">
    <div class="max-w-full px-5 overflow-x-auto sm:px-6">
      <table class="min-w-full">
        <thead class="border-gray-100 border-y dark:border-white/[0.05]">
          <tr>
            <th class="py-3 font-normal text-gray-500 text-start text-theme-sm dark:text-gray-400">ID</th>
            <th class="px-4 py-3 font-normal text-gray-500 text-start text-theme-sm dark:text-gray-400">Nom</th>
            <th class="px-4 py-3 font-normal text-gray-500 text-start text-theme-sm dark:text-gray-400">Description</th>
            <th class="px-4 py-3 font-normal text-gray-500 text-start text-theme-sm dark:text-gray-400">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-white/[0.05]">
          <!-- ✅ Utilise currentItems pour la pagination -->
          <tr *ngFor="let item of currentItems">
            <td class="px-4 py-4 text-gray-700 dark:text-gray-400 text-theme-sm">{{ item.id }}</td>
            <td class="px-4 py-4 font-medium text-gray-700 dark:text-gray-400 text-theme-sm">{{ item.name }}</td>
            <td class="px-4 py-4 text-gray-700 dark:text-gray-400 text-theme-sm">{{ item.description }}</td>
            <td class="px-4 sm:px-6 py-3.5">
              <div class="flex items-center gap-3">

                <!-- Bouton Modifier -->
                <button
                  (click)="handleEdit(item); $event.stopPropagation()"
                  title="Modifier"
                >
                  <svg width="1em" height="1em" viewBox="0 0 20 20" fill="none"
                       xmlns="http://www.w3.org/2000/svg"
                       class="text-gray-700 cursor-pointer size-5 hover:text-blue-500 dark:text-gray-400 dark:hover:text-blue-400">
                    <path d="M13.586 3.586a2 2 0 1 1 2.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"
                          fill="currentColor"/>
                  </svg>
                </button>

                <!-- Bouton Supprimer -->
                <button
                  (click)="deleteCategorie(item.id!); $event.stopPropagation()"
                  title="Supprimer"
                >
                  <svg width="1em" height="1em" viewBox="0 0 20 20" fill="none"
                       xmlns="http://www.w3.org/2000/svg"
                       class="text-gray-700 cursor-pointer size-5 hover:text-error-500 dark:text-gray-400 dark:hover:text-error-500">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                      d="M6.54142 3.7915C6.54142 2.54886 7.54878 1.5415 8.79142 1.5415H11.2081C12.4507 1.5415 13.4581 2.54886 13.4581 3.7915V4.0415H15.6252H16.666C17.0802 4.0415 17.416 4.37729 17.416 4.7915C17.416 5.20572 17.0802 5.5415 16.666 5.5415H16.3752V8.24638V13.2464V16.2082C16.3752 17.4508 15.3678 18.4582 14.1252 18.4582H5.87516C4.63252 18.4582 3.62516 17.4508 3.62516 16.2082V13.2464V8.24638V5.5415H3.3335C2.91928 5.5415 2.5835 5.20572 2.5835 4.7915C2.5835 4.37729 2.91928 4.0415 3.3335 4.0415H4.37516H6.54142V3.7915Z"
                      fill="currentColor">
                    </path>
                  </svg>
                </button>

              </div>
            </td>
          </tr>
          <tr *ngIf="currentItems.length === 0">
            <td colspan="4" class="px-4 py-8 text-center text-gray-400 text-theme-sm dark:text-gray-500">
              Aucune catégorie trouvée.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
  <div class="px-6 py-4 border-t border-gray-200 dark:border-white/[0.05] flex items-center justify-between">
    <button
      (click)="goToPage(currentPage - 1)"
      [disabled]="currentPage === 1"
      class="px-3 py-1.5 text-sm border border-gray-300 dark:border-gray-700 rounded-lg text-gray-700 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-white/5 disabled:opacity-40 disabled:cursor-not-allowed"
    >
      Précédent
    </button>
    <span class="text-sm text-gray-700 dark:text-gray-400">Page {{ currentPage }} / {{ totalPages }}</span>
    <button
      (click)="goToPage(currentPage + 1)"
      [disabled]="currentPage === totalPages"
      class="px-3 py-1.5 text-sm border border-gray-300 dark:border-gray-700 rounded-lg text-gray-700 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-white/5 disabled:opacity-40 disabled:cursor-not-allowed"
    >
      Suivant
    </button>
  </div>
</div>

<!-- ===== MODAL: Ajouter / Modifier ===== -->
<div *ngIf="showFormModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
  <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-xl w-full max-w-md mx-4 p-6" (click)="$event.stopPropagation()">
    <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-4">
      {{ isEditMode ? 'Modifier la catégorie' : 'Ajouter une catégorie' }}
    </h4>
    <form (ngSubmit)="isEditMode ? updateCategorie() : addCategorie()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nom *</label>
        <input
          type="text"
          [(ngModel)]="formData.name"
          name="name"
          required
          placeholder="Ex: Restaurant"
          class="w-full h-[42px] rounded-lg border border-gray-300 px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-none focus:ring-2 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-800 dark:text-white/90 dark:placeholder:text-white/30"
        />
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
        <textarea
          [(ngModel)]="formData.description"
          name="description"
          rows="3"
          placeholder="Courte description..."
          class="w-full rounded-lg border border-gray-300 px-4 py-2 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-none focus:ring-2 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-800 dark:text-white/90 dark:placeholder:text-white/30 resize-none"
        ></textarea>
      </div>
      <div class="flex justify-end gap-3">
        <button
          type="button"
          (click)="closeFormModal()"
          class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-white/5"
        >
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="!formData.name.trim()"
          class="px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 disabled:opacity-40 disabled:cursor-not-allowed"
        >
          {{ isEditMode ? 'Enregistrer' : 'Ajouter' }}
        </button>
      </div>
    </form>
  </div>
</div>

<p-toast />
