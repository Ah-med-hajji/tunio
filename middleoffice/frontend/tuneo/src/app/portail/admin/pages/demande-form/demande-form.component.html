<!-- Success Message -->
<div *ngIf="submitted" class="p-6 flex flex-col items-center justify-center min-h-[400px]">
  <div class="bg-green-50 border border-green-200 rounded-2xl p-10 text-center max-w-md">
    <div class="text-5xl mb-4">✅</div>
    <h2 class="text-xl font-bold text-green-700 mb-2">Demande envoyée !</h2>
    <p class="text-gray-500 mb-6">Votre demande a été soumise. L'admin va l'examiner et vous notifier.</p>
    <button (click)="goToDemandes()"
      class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
      Voir les demandes
    </button>
  </div>
</div>

<!-- Form -->
<div *ngIf="!submitted" class="p-6 max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-800 mb-2">📝 Nouvelle demande d'ajout</h1>
  <p class="text-gray-500 mb-6">Remplissez ce formulaire pour soumettre votre établissement.</p>

  <!-- Error -->
  <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4">
    {{ errorMessage }}
  </div>

  <div class="bg-white rounded-xl shadow p-6 space-y-5">

    <!-- Nom -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nom de l'établissement *</label>
      <input [(ngModel)]="demande.name" type="text" placeholder="Ex: Hôtel El Mouradi"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Catégorie -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Catégorie *</label>
      <select [(ngModel)]="demande.categorie.id"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">-- Choisir une catégorie --</option>
        <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
      </select>
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea [(ngModel)]="demande.description" rows="3" placeholder="Décrivez votre établissement..."
        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <!-- Adresse -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
      <input [(ngModel)]="demande.address" type="text" placeholder="Ex: Av. Habib Bourguiba, Tunis"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Téléphone & Email -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
        <input [(ngModel)]="demande.phone" type="tel" placeholder="Ex: +216 71 000 000"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input [(ngModel)]="demande.email" type="email" placeholder="Ex: contact@hotel.tn"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>

    <!-- Image -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Image</label>
      <input type="file" accept="image/*" (change)="onImageSelected($event)"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm">
      <img *ngIf="demande.imageUrl" [src]="demande.imageUrl"
        class="mt-3 w-32 h-32 object-cover rounded-lg border">
    </div>

    <!-- Submit -->
    <div class="flex justify-end pt-2">
      <button (click)="submit()"
        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
        Envoyer la demande
      </button>
    </div>

  </div>
</div>
