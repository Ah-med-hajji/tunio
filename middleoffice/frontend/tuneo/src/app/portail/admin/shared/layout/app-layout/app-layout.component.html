<!--
  Layout strategy:
    - Authenticated users (admin, partner, user) see the sidebar.
    - Anonymous visitors land on the public marketing pages (homepage / results /
      reservation) without the sidebar.
-->
@if (role === 'role_admin' || role === 'role_partner' || role === 'role_user') {
  <div class="min-h-screen flex">
    <div>
      <app-sidebar></app-sidebar>
      <app-backdrop></app-backdrop>
    </div>
    <div
      class="flex-1 transition-all duration-300 ease-in-out"
      [ngClass]="{
        'ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async)
      }"
    >
      <app-header />
      <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
} @else {
  <div>
    <router-outlet></router-outlet>
    <app-chatbot></app-chatbot>
  </div>
}
